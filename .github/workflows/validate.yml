name: Validate

# Runs on every PR and on a weekly schedule. The schedule matters as much as
# the PR trigger: it is how a new Alpine or upstream CVE surfaces on a base
# image nobody has touched in a month.
on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [wp-base, next-base]
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: images/${{ matrix.image }}/Dockerfile
          failure-threshold: warning

  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: wp-base
            target: ""
          - image: next-base
            target: runtime
          - image: next-base
            target: builder
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          target: ${{ matrix.target }}
          load: true
          tags: ${{ matrix.image }}:pr
          cache-from: type=gha,scope=${{ matrix.image }}-pr
          cache-to: type=gha,scope=${{ matrix.image }}-pr,mode=max

      - name: Scan for vulnerabilities
        # v0.36.0 pinned by commit. The bare "0.28.0" tag this used to read
        # never existed at all (upstream only tags "v0.28.0"), and that
        # version, once corrected, turned out broken anyway: its own
        # action.yaml pins aquasecurity/setup-trivy@v0.2.1, a tag upstream
        # has since deleted. v0.36.0 pins setup-trivy@v0.2.6, which exists.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:pr
          format: sarif
          output: trivy-${{ matrix.image }}-${{ matrix.target || 'default' }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image }}-${{ matrix.target || 'default' }}.sarif
          category: ${{ matrix.image }}-${{ matrix.target || 'default' }}

  smoke-wp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build wp-base
        uses: docker/build-push-action@v6
        with:
          context: images/wp-base
          load: true
          tags: wp-base:pr

      # A build that succeeds proves nothing about a runtime that has to serve
      # PHP through nginx and php-fpm under supervisor. This does.
      - name: Serve PHP end to end
        run: ./tests/smoke-wp.sh wp-base:pr
