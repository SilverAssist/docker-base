name: Build wp-base

# Releases are cut by pushing a tag: wp-base/v1.0.0
# workflow_dispatch rebuilds the same version without a new tag, which is how
# you pick up an Alpine security update between releases.
on:
  push:
    tags:
      - "wp-base/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0)"
        required: true

permissions:
  contents: read
  packages: write
  id-token: write # OIDC, both for the ECR role and for cosign

env:
  IMAGE_NAME: wp-base
  CONTEXT: images/wp-base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#wp-base/v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CodeBuild pulls from ECR, not GHCR: same region as the build, no
      # internet egress and no third-party rate limit in the hot path.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: |
            ghcr.io/silverassist/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ghcr.io/silverassist/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.minor }}
            ghcr.io/silverassist/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.major }}
            ghcr.io/silverassist/${{ env.IMAGE_NAME }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.minor }}
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.major }}
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=wp-base
          cache-to: type=gha,scope=wp-base,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signing: the signature is bound to this workflow's OIDC
      # identity, so a consumer can verify the image was built here and not
      # pushed by hand.
      - name: Sign images
        run: |
          cosign sign --yes \
            "ghcr.io/silverassist/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          cosign sign --yes \
            "${{ steps.ecr.outputs.registry }}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"

      - name: Report digest
        run: |
          echo "### wp-base ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Pin this digest in consuming Dockerfiles:' >> "$GITHUB_STEP_SUMMARY"
          echo '```dockerfile' >> "$GITHUB_STEP_SUMMARY"
          echo "FROM ${{ steps.ecr.outputs.registry }}/${IMAGE_NAME}:${{ steps.version.outputs.version }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
