name: Build wp-base

# Releases are cut by pushing a tag: wp-base/v1.0.0
# workflow_dispatch rebuilds the same version without a new tag, which is how
# you pick up an Alpine security update between releases.
on:
  push:
    tags:
      - "wp-base/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0)"
        required: true

permissions:
  contents: read
  packages: write
  id-token: write # OIDC, both for the ECR role and for cosign

env:
  IMAGE_NAME: wp-base
  CONTEXT: images/wp-base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#wp-base/v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ECR is optional. Until the OIDC role exists, releases publish to GHCR
      # alone — public GHCR images need no auth and have no pull rate limit, so
      # consumers can already pull them. Setting AWS_ECR_ROLE_ARN turns the
      # in-region mirror on with no other change.
      - name: Configure AWS credentials
        id: aws
        if: vars.AWS_ECR_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        if: vars.AWS_ECR_ROLE_ARN != ''
        uses: aws-actions/amazon-ecr-login@v2

      - name: Assemble tag list
        id: tags
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          VERSION: ${{ steps.version.outputs.version }}
          MINOR: ${{ steps.version.outputs.minor }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          {
            echo "list<<EOF"
            for t in "$VERSION" "$MINOR" "$MAJOR" latest; do
              echo "ghcr.io/silverassist/${IMAGE_NAME}:${t}"
              [ -n "$ECR_REGISTRY" ] && echo "${ECR_REGISTRY}/${IMAGE_NAME}:${t}"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=wp-base
          cache-to: type=gha,scope=wp-base,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signing: the signature is bound to this workflow's OIDC
      # identity, so a consumer can verify the image was built here and not
      # pushed by hand.
      - name: Sign images
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          cosign sign --yes "ghcr.io/silverassist/${IMAGE_NAME}@${DIGEST}"
          if [ -n "$ECR_REGISTRY" ]; then
            cosign sign --yes "${ECR_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          fi

      - name: Report digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### ${IMAGE_NAME} ${VERSION}"
            echo
            echo 'Pin this digest in consuming Dockerfiles:'
            echo '```dockerfile'
            if [ -n "$ECR_REGISTRY" ]; then
              echo "FROM ${ECR_REGISTRY}/${IMAGE_NAME}:${VERSION}@${DIGEST}"
            else
              echo "FROM ghcr.io/silverassist/${IMAGE_NAME}:${VERSION}@${DIGEST}"
            fi
            echo '```'
            [ -n "$ECR_REGISTRY" ] || echo '> ECR mirror skipped: `AWS_ECR_ROLE_ARN` is not set.'
          } >> "$GITHUB_STEP_SUMMARY"
